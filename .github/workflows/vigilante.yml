name: Vigilante de n8n

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preguntarle a n8n si sigue vivo
        env:
          N8N_URL: ${{ secrets.N8N_URL }}
        run: curl -fsS --retry 3 --retry-delay 20 "$N8N_URL/healthz" | grep -q '"ok"'
